name: Build Rustc WASM Engine

on:
  workflow_dispatch: # Mengizinkan trigger manual dari UI GitHub Actions

jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Runner Diet (Free up disk space)
        # Menghapus software tidak terpakai di server GHA agar tidak Out of Memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Checkout Rust Source Code
        uses: actions/checkout@v4
        with:
          repository: 'rust-lang/rust'
          ref: '1.79.0' # Menggunakan versi stabil

      - name: Install System Dependencies (Binaryen & Zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen zstd python3 wget

      - name: Install WASI SDK (Solusi Error wasi-root)
        # Wajib untuk me-compile rustc menjadi wasm32-wasi (Host)
        run: |
          wget -qO wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz
          tar xf wasi-sdk.tar.gz
          sudo mv wasi-sdk-20.0 /opt/wasi-sdk
          echo "WASI_SDK_PATH=/opt/wasi-sdk" >> $GITHUB_ENV

      - name: Inject Extreme config.toml
        # Mengunci arsitektur hanya untuk Linux (Build) dan WASM (Host & Target)
        # Serta mengunduh LLVM pre-built untuk menghemat waktu 2 jam!
        run: |
          cat << 'TOML_EOF' > config.toml
          change-id = 123711
          profile = "compiler"
          
          [llvm]
          # INI KUNCI MENGHEMAT WAKTU 2 JAM! Jangan compile LLVM dari nol!
          download-ci-llvm = "if-available"
          
          [build]
          # Kunci arsitektur agar tidak compile untuk Mac/Windows
          build = "x86_64-unknown-linux-gnu"
          host = ["wasm32-wasi"]
          target = ["wasm32-unknown-unknown"]
          cargo-native-static = true
          profiler = false
          docs = false
          compiler-docs = false
          
          [rust]
          optimize = true
          lto = "fat"
          codegen-units = 1
          debug = false
          backtrace = false
          
          [target.wasm32-wasi]
          wasi-root = "/opt/wasi-sdk"
          cc = "/opt/wasi-sdk/bin/clang"
          cxx = "/opt/wasi-sdk/bin/clang++"
          linker = "/opt/wasi-sdk/bin/wasm-ld"
          ar = "/opt/wasi-sdk/bin/llvm-ar"
          llvm-config = ""
          codegen-backends = ["cranelift"]
          TOML_EOF

      - name: Bootstrap Rustc & Tools (Stage 1 Cross-Compilation)
        env:
          # Senjata Rahasia disuntikkan spesifik untuk Host WASM!
          CARGO_TARGET_WASM32_WASI_RUSTFLAGS: "-C opt-level=z -C link-arg=-s -C panic=abort"
        run: |
          ./x.py build --stage 1 compiler/rustc
          ./x.py build --stage 1 src/tools/cargo src/tools/rustfmt

      - name: Locate, Optimize, and Collect WASM & Sysroot
        # Perbaikan script Bash agar output .wasm berhasil dibuat dan sysroot tercopy
        run: |
          mkdir -p dist/engine
          
          echo "=== MENCARI FILE WASM HASIL KOMPILASI ==="
          find build -type f -name "*.wasm" || true
          
          echo "=== MENGOPTIMASI FILE WASM ==="
          find build -type f -name "*.wasm" | while read -r wasm_file; do
            filename=$(basename "$wasm_file")
            echo "Mengecilkan $filename ..."
            wasm-opt -Oz "$wasm_file" -o "dist/engine/$filename"
          done
          
          echo "=== MENYALIN PRE-COMPILED SYSROOT (STANDAR LIB) ==="
          mkdir -p dist/engine/sysroot
          find build -type d -path "*/stage1-sysroot/lib/rustlib/wasm32-unknown-unknown/lib" -exec cp -r {}/* dist/engine/sysroot/ \; || true
          
          echo "=== ISI FOLDER AKHIR SEBELUM DIPAKETKAN ==="
          ls -la dist/engine/
          ls -la dist/engine/sysroot/ || echo "Sysroot kosong/tidak ditemukan"

      - name: Package with Zstandard (.tar.zst)
        run: |
          tar --zstd -cvf engine-toolchain.tar.zst -C dist engine/

      - name: Upload Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-toolchain-wasm
          path: engine-toolchain.tar.zst
          retention-days: 7
