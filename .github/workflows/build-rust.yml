name: Build Rust Brain (WebAssembly WASM)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rust-brain.yml'

jobs:
  build-rust-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasi

      - name: Create Cargo Project for Rust Brain
        run: |
          mkdir -p rust-brain
          cd rust-brain
          cargo init --bin
          
          cat << 'EOF' > Cargo.toml
          [package]
          name = "rust-brain"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          # Menggunakan WASM Interpreter ultra-ringan di dalam Rust brain
          wasmi = { version = "0.31.2", default-features = false }

          [profile.release]
          opt-level = "z"
          lto = true
          codegen-units = 1
          panic = "abort"
          strip = true
          EOF

          cat << 'EOF' > src/main.rs
          fn main() {
              println!("Halo dari Otak Rust yang berjalan penuh di dalam WASM Sandbox!");
          }
          EOF

      - name: Build Rust Brain for WASI
        run: |
          cd rust-brain
          cargo build --release --target wasm32-wasi

      - name: Package WASM Output
        run: |
          mkdir -p release-dist
          cp rust-brain/target/wasm32-wasi/release/rust-brain.wasm release-dist/rust-brain.wasm
          echo "Hasil Ukuran File WASM:"
          ls -lh release-dist/rust-brain.wasm

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-brain-wasm
          path: release-dist/rust-brain.wasm
